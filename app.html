}

function compareTableHtml(quotes) {
  const rows = BREAKDOWN_CATS.map(c => `<tr><td>${c.label}</td>${quotes.map(q => `<td>${(q.breakdown && q.breakdown[c.key]) ? money(q.breakdown[c.key]) : '<span style="color:var(--muted)">—</span>'}</td>`).join('')}</tr>`).join('');
  return `<div class="card"><h3>大類金額對比</h3><div class="tbwrap"><table class="tb cmp">
    <tr><th>大類</th>${quotes.map(q => `<th>${esc(q.company)}</th>`).join('')}</tr>
    ${rows}
    <tr><td><b>總價</b></td>${quotes.map(q => `<td><b>${money(q.total)}</b></td>`).join('')}</tr>
  </table></div></div>`;
}

function quoteItemRowHtml(it) {
  return `<div class="lirow"><div class="lirowline"><input type="text" data-li-name aria-label="項目名稱" placeholder="項目（例：睡房訂造櫃）" value="${esc(it.name || '')}"><input type="text" inputmode="numeric" data-li-amount aria-label="金額（$）" placeholder="金額" value="${it.amount === '' || it.amount === null || it.amount === undefined ? '' : esc(String(it.amount))}"><button type="button" class="iconbtn" data-li-del aria-label="刪除此項">🗑️</button></div><small class="lierr" style="color:var(--danger)"></small></div>`;
}

// 大類金額合計（只計正整數）
function breakdownSum(b) {
  return Object.values(b || {}).reduce((a, v) => a + (Number.isInteger(+v) && +v > 0 ? +v : 0), 0);
}
// 「舊報價」＝冇明細，而且總價同大類金額合計對唔上（例如當時手打總價）：編輯時沿用原有總價，唔好靜靜改數。
// 淨係填大類金額嘅報價（總價＝大類合計）唔算舊報價，改大類金額總價會跟住變。
function isLegacyQuote(q) {
  if (!q || quoteLineItems(q)) return false;
  const bs = breakdownSum(q.breakdown);
  return !(bs > 0 && bs === +q.total);
}

// 收集＋驗證明細；回傳 { items, total, ok }。填咗一半／非數字一律 inline 報錯，唔會當 0。
// 完全空白嘅行直接略過（唔再當錯誤）；全部都空白 → items: null，由呼叫方決定用大類金額定報錯。
function collectQuoteItems() {
  const rows = [...appEl.querySelectorAll('#q-items .lirow')];
  const raw = rows.map(r => ({ row: r, name: r.querySelector('[data-li-name]').value.trim(), amount: r.querySelector('[data-li-amount]').value.trim().replace(/,/g, '') }));
  rows.forEach(r => { r.querySelector('.lierr').textContent = ''; });
  if (raw.every(r => !r.name && !r.amount)) return { items: null, ok: true };
  let ok = true; const items = [];
  raw.forEach(r => {
    if (!r.name && !r.amount) return;   // 空白行略過
    const err = r.row.querySelector('.lierr');
    if (!r.name) { err.textContent = '請填項目名稱（或刪除此行）'; ok = false; return; }
    if (!r.amount) { err.textContent = '請填金額，唔可以留空'; ok = false; return; }
    if (!/^\d+$/.test(r.amount)) { err.textContent = '金額要係整數數字（唔好加符號或文字）'; ok = false; return; }
    items.push({ name: r.name, amount: +r.amount });
  });
  return { items, ok, total: items.reduce((a, b) => a + b.amount, 0) };
}

function quoteFormHtml(editing, missingScopes) {
  const q = editing || { breakdown: {}, flags: {} };
  const items = quoteLineItems(q);
  const legacy = isLegacyQuote(editing);
  const breakdownInputs = BREAKDOWN_CATS.map(c => `
    <div><label class="f" for="q-bd-${c.key}">${c.label}</label><input type="number" id="q-bd-${c.key}" data-bd="${c.key}" value="${(q.breakdown && q.breakdown[c.key]) || ''}" min="0"></div>`).join('');
  const flagChecks = FLAGS.map(f => `
    <label><input type="checkbox" data-flag="${f.key}" ${(q.flags && q.flags[f.key]) ? 'checked' : ''}> ${esc(f.label)}${f.weight===2?' <span style="color:var(--danger);font-weight:700">⚠</span>':''}</label>`).join('');
  return `
    <h3>${editing ? '編輯報價' : '新增公司報價'}</h3>
    ${missingScopes.length ? `<label class="f" for="q-quote-for">呢份報價處理邊個合約漏項？</label><select id="q-quote-for"><option value="">未指定</option>${missingScopes.map(item => `<option value="${esc(item.label)}" ${((q.flags && q.flags._quote_for) || state.prefillQuoteScope) === item.label ? 'selected' : ''}>${esc(item.label)}</option>`).join('')}</select>` : ''}
    <label class="f" for="q-company">公司名稱</label>
    <input type="text" id="q-company" value="${esc(q.company || '')}" placeholder="例：安居工程">
    <div class="f" id="q-items-label">工程項目（總價 = 明細合計）</div>
    <p class="dt">兩個方法揀一個就得：逐項填明細（總價自動合計），或者淨係填下面嘅「大類金額」（總價 = 大類合計）。兩樣都填嘅話，總價用明細合計；對比表嘅分類睇「大類金額」。</p>
    ${legacy ? '<div class="note" id="q-legacy-note">呢份舊報價未有工程明細，總價暫時沿用原有金額。請補返項目同金額；補完之後總價會自動等於明細合計。</div>' : ''}
    <div id="q-items" role="group" aria-labelledby="q-items-label">${(items && items.length ? items : [{ name: '', amount: '' }]).map(it => quoteItemRowHtml(it)).join('')}</div>
    <button type="button" class="btn sm gh" id="q-additem">＋ 加項目</button>
    <label class="f" for="q-total">總價（$）— 自動計算，唔使輸入</label>
    <input type="text" id="q-total" readonly value="${q.total || ''}" placeholder="$0">
    <div class="dt" id="q-total-note"></div>
    <div class="f" id="q-bd-label">大類金額</div>
    <div class="grid2" role="group" aria-labelledby="q-bd-label">${breakdownInputs}</div>
    <div class="dt" id="q-mismatch" style="color:var(--accent)"></div>
    <div class="f" id="q-flags-label">十條紅旗（剔咗代表呢間公司有呢個問題；⚠ 係重點扣分項）</div>
    <div class="flaglist" role="group" aria-labelledby="q-flags-label">${flagChecks}</div>
    <label class="f" for="q-file">上載報價單檔案（PDF／相片，可選）</label>
    <input type="file" id="q-file" accept=".pdf,image/*">
    <div class="mtop">
      <button class="btn" id="q-save">${editing ? '儲存' : '加入比較'}</button>
      <button class="btn gh" id="q-cancel" style="margin-left:8px">取消</button>
    </div>`;
}

function attachQuotesEvents(project, contract) {
  const addContractBtn = document.getElementById('addContractBtn');
  if (addContractBtn) addContractBtn.addEventListener('click', () => { state.contractFormOpen = true; renderQuotes(); });
  const addMissingBtn = document.getElementById('addMissingQuoteBtn');
  if (addMissingBtn) addMissingBtn.addEventListener('click', () => { state.quoteFormOpen = true; state.editingQuoteId = null; state.prefillQuoteScope = null; renderQuotes(); });
  const addBtn = document.getElementById('addQuoteBtn');
  if (addBtn) addBtn.addEventListener('click', () => { state.quoteFormOpen = true; state.editingQuoteId = null; state.prefillQuoteScope = null; renderQuotes(); });
  const cancelBtn = document.getElementById('q-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { state.quoteFormOpen = false; state.editingQuoteId = null; state.prefillQuoteScope = null; renderQuotes(); });
  const cancelContractBtn = document.getElementById('c-cancel');
  if (cancelContractBtn) cancelContractBtn.addEventListener('click', () => { state.contractFormOpen = false; state.editingQuoteId = null; location.hash = '#/quotes'; renderQuotes(); });
  appEl.querySelectorAll('[data-editcontract]').forEach(el => el.addEventListener('click', () => { state.contractFormOpen = true; state.editingQuoteId = el.dataset.editcontract; renderQuotes(); }));
  appEl.querySelectorAll('[data-copy-question]').forEach(el => el.addEventListener('click', () => copyText(CONTRACT_SCOPE_QUESTIONS[el.dataset.copyQuestion], el)));
  appEl.querySelectorAll('[data-resolve-scope]').forEach(el => el.addEventListener('click', async () => {
    state.contractFormOpen = true; state.editingQuoteId = contract.id; await renderQuotes();
    const field = appEl.querySelector(`[data-contract-scope="${el.dataset.resolveScope}"]`);
    if (field) { field.focus(); field.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }));
  appEl.querySelectorAll('[data-add-scope-quote]').forEach(el => el.addEventListener('click', () => {
    const item = CONTRACT_SCOPES.find(x => x.key === el.dataset.addScopeQuote);
    state.prefillQuoteScope = item ? item.label : null;
    state.quoteFormOpen = true; state.editingQuoteId = null; renderQuotes();
  }));
  appEl.querySelectorAll('[data-select-responsibility]').forEach(el => el.addEventListener('click', async () => {
    const selectedId = el.dataset.selectResponsibility;
    const scopeLabel = el.dataset.scopeLabel;
    const matching = state.quotes.filter(q => q.flags && q.flags._quote_for === scopeLabel);
    try {
      await Promise.all(matching.map(q => updateQuote(q.id, { flags: { ...q.flags, _responsibility_selected: q.id === selectedId } })));
      if (contract && contract.flags && contract.flags._handoff_confirmed) {
        await updateQuote(contract.id, { flags: { ...contract.flags, _handoff_confirmed: false } });
      }
      toast('已揀定負責公司');
      renderQuotes();
    } catch (e) { toast('未能更新負責公司：' + e.message, true); }
  }));
  const confirmHandoffBtn = document.getElementById('confirmHandoffBtn');
  if (confirmHandoffBtn) confirmHandoffBtn.addEventListener('click', async () => {
    const otherQuotes = state.quotes.filter(q => q !== contract);
    if (handoffStatus(contract, otherQuotes).unresolved.length) { toast('仲有工程未落實負責公司', true); return; }
    try {
      await updateQuote(contract.id, { flags: { ...contract.flags, _handoff_confirmed: true } });
      toast('責任交接已確認 ✓');
      location.hash = '#/build';
    } catch (e) { toast('未能確認交接：' + e.message, true); }
  });
  appEl.querySelectorAll('[data-open-build]').forEach(el => el.addEventListener('click', () => { location.hash = '#/build'; }));

  appEl.querySelectorAll('[data-editquote]').forEach(el => el.addEventListener('click', () => {
    state.quoteFormOpen = true; state.editingQuoteId = el.dataset.editquote; state.prefillQuoteScope = null; renderQuotes();
  }));
  appEl.querySelectorAll('[data-delquote]').forEach(el => el.addEventListener('click', async () => {
    if (!confirm('刪除呢間公司報價？')) return;
    const id = el.dataset.delquote;
    const backup = state.quotes.slice();
    state.quotes = state.quotes.filter(q => q.id !== id);
    renderQuotes();
    try { await deleteQuote(id); toast('已刪除'); } catch (e) { state.quotes = backup; toast(e.message, true); renderQuotes(); }
  }));
  appEl.querySelectorAll('[data-signquote]').forEach(el => el.addEventListener('click', () => toggleQuoteSigned(el.dataset.signquote, true)));
  appEl.querySelectorAll('[data-unsignquote]').forEach(el => el.addEventListener('click', () => toggleQuoteSigned(el.dataset.unsignquote, false)));
  appEl.querySelectorAll('[data-viewfile]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.preventDefault();
    const q = state.quotes.find(x => x.id === el.dataset.viewfile);
    if (!q || !q.file_path) return;
    try { const { data, error } = await quoteFileSignedUrl(q.file_path); if (error) throw error; window.open(data.signedUrl, '_blank'); }
    catch (e) { toast('打開檔案失敗：' + e.message, true); }
  }));

  const itemsBox = document.getElementById('q-items');
  if (itemsBox) {
    const bdInputs = [...document.querySelectorAll('[data-bd]')];
    const refreshTotal = () => {
      const itemsSum = [...itemsBox.querySelectorAll('[data-li-amount]')].reduce((a, el) => { const v = el.value.trim().replace(/,/g, ''); return /^\d+$/.test(v) ? a + +v : a; }, 0);
      const anyEntered = [...itemsBox.querySelectorAll('[data-li-amount],[data-li-name]')].some(el => el.value.trim());
      const bdTotal = bdInputs.reduce((a, el) => { const v = el.value.trim(); return /^\d+$/.test(v) ? a + +v : a; }, 0);
      const cur = state.quotes.find(q => q.id === state.editingQuoteId);
      let total, note = '';
      if (anyEntered) { total = itemsSum; note = '來源：工程明細合計'; }
      else if (isLegacyQuote(cur)) { total = cur.total || ''; note = cur.total ? '來源：原有總價（未有明細）' : ''; }
      else if (bdTotal > 0) { total = bdTotal; note = '來源：大類金額合計'; }
      else { total = 0; }
      document.getElementById('q-total').value = total;
      document.getElementById('q-total-note').textContent = note;
      document.getElementById('q-mismatch').textContent = (anyEntered && itemsSum > 0 && bdTotal > 0 && itemsSum !== bdTotal)
        ? `明細合計 ${money(itemsSum)}，大類金額合計 ${money(bdTotal)}，兩者唔一樣。總價用明細合計，對比表嘅分類用大類金額。` : '';
    };
    bdInputs.forEach(el => el.addEventListener('input', () => { clearFieldError(el); refreshTotal(); }));
    if (state.editingQuoteId) refreshTotal();   // 編輯：即刻顯示總價來源；新增：留空，等用家填
    itemsBox.addEventListener('input', (ev) => { const e = ev.target.closest('.lirow'); if (e) e.querySelector('.lierr').textContent = ''; refreshTotal(); });
    itemsBox.addEventListener('click', (ev) => {
      if (!ev.target.closest('[data-li-del]')) return;
      ev.target.closest('.lirow').remove();
      if (!itemsBox.querySelector('.lirow')) itemsBox.insertAdjacentHTML('beforeend', quoteItemRowHtml({}));
      refreshTotal();
    });
    document.getElementById('q-additem').addEventListener('click', () => {
      itemsBox.insertAdjacentHTML('beforeend', quoteItemRowHtml({}));
      itemsBox.querySelector('.lirow:last-child [data-li-name]').focus();
    });
  }

  const saveBtn = document.getElementById('q-save');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    const company = document.getElementById('q-company').value.trim();
    if (!company) { toast('請輸入公司名稱', true); return; }
    // 大類金額：非負整數、有上限；0／留空當未填
    const breakdown = {}; let bdBad = null;
    BREAKDOWN_CATS.forEach(c => {
      const el = document.getElementById('q-bd-' + c.key);
      const r = readNumber(el, { ...LIMITS.money, label: c.label });
      if (!r) { if (!bdBad) bdBad = el; return; }
      breakdown[c.key] = r.value || null;
    });
    const current = state.quotes.find(q => q.id === state.editingQuoteId);
    const flags = Object.assign({}, (current && current.flags) || {});
    appEl.querySelectorAll('[data-flag]').forEach(el => { flags[el.dataset.flag] = el.checked; });
    const quoteFor = document.getElementById('q-quote-for');
    if (quoteFor) flags._quote_for = quoteFor.value || null;
    const legacyEdit = isLegacyQuote(current);
    const li = collectQuoteItems();
    if (!li.ok) { toast('工程明細有錯，請睇紅色提示', true); return; }
    if (bdBad) { bdBad.focus(); return; }
    const bdTotal = breakdownSum(breakdown);
    let total;
    if (li.items) { flags._line_items = li.items; total = li.total; }          // 有明細：總價 = 明細合計
    else if (legacyEdit) total = current.total || null;                          // 舊報價未補明細：沿用原有總價
    else if (bdTotal > 0) { delete flags._line_items; total = bdTotal; }         // 淨係填大類金額：總價 = 大類合計
    else {
      const firstErr = appEl.querySelector('#q-items .lierr');
      if (firstErr) firstErr.textContent = '請填工程明細（項目＋金額），或者喺下面填大類金額';
      toast('請填工程明細或大類金額', true); return;
    }
    const score = computeQuoteScore(flags);
    const fields = { company, total, breakdown, flags, score };
    const fileInput = document.getElementById('q-file');
    try {
      saveBtn.disabled = true; saveBtn.innerHTML = '<span class="spin"></span>';
      let quote;
      if (state.editingQuoteId) {
        quote = await updateQuote(state.editingQuoteId, fields);
      } else {
        quote = await createQuote(state.user.id, project.id, fields);
      }
      if (fileInput.files && fileInput.files[0]) {
        const path = await uploadQuoteFile(state.user.id, quote.id, fileInput.files[0]);
        await updateQuote(quote.id, { file_path: path });
      }
      toast('已儲存');
      state.quoteFormOpen = false; state.editingQuoteId = null; state.prefillQuoteScope = null;
      renderQuotes();
    } catch (e) { toast(e.message, true); saveBtn.disabled = false; saveBtn.textContent = state.editingQuoteId ? '儲存' : '加入比較'; }
  });

  const contractSaveBtn = document.getElementById('c-save');
  if (contractSaveBtn) contractSaveBtn.addEventListener('click', async () => {
    const company = document.getElementById('c-company').value.trim();
    if (!company) { toast('請輸入裝修公司名稱', true); return; }
    const scope = {};
    appEl.querySelectorAll('[data-contract-scope]').forEach(el => { scope[el.dataset.contractScope] = el.value; });
    const startDate = document.getElementById('c-start').value || null;
    const endDate = document.getElementById('c-end').value || null;
    const fields = {
      company,
      total: +document.getElementById('c-total').value || null,
      status: 'signed',
      score: 10,
      flags: { _kind: 'contract', _contract_scope: scope, _contract_end_date: endDate },
    };
    const fileInput = document.getElementById('c-file');
    try {
      contractSaveBtn.disabled = true; contractSaveBtn.innerHTML = '<span class="spin"></span>';
      let saved;
      if (contract && state.editingQuoteId === contract.id) saved = await updateQuote(contract.id, fields);
      else saved = await createQuote(state.user.id, project.id, fields);
      if (fileInput.files && fileInput.files[0]) {
        const path = await uploadQuoteFile(state.user.id, saved.id, fileInput.files[0]);
        await updateQuote(saved.id, { file_path: path });
      }
      if (startDate !== project.start_date) await updateProject(project.id, { start_date: startDate });
      state.contractFormOpen = false; state.editingQuoteId = null;
      location.hash = '#/quotes';
      toast('已儲存合約同漏項檢查 ✓');
      renderQuotes();
    } catch (e) { toast(e.message, true); contractSaveBtn.disabled = false; contractSaveBtn.textContent = contract ? '儲存更改' : '儲存已簽合約'; }
  });
}

async function toggleQuoteSigned(id, signed) {
  const q = state.quotes.find(x => x.id === id);
  if (!q) return;
  const prevStatus = q.status;
  q.status = signed ? 'signed' : 'pending';
  renderQuotes();
  try { await updateQuote(id, { status: q.status }); toast(signed ? '已標記簽約' : '已取消簽約'); }
  catch (e) { q.status = prevStatus; toast(e.message, true); renderQuotes(); }
}
