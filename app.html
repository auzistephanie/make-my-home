<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裝修無伏 — MakeMyHome</title>
<link rel="stylesheet" href="css/shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app"><div class="empty">載入緊…</div></div>
<div id="toast" class="toast"></div>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/photos.js"></script>
<script src="js/content.js"></script>
<script src="js/validate.js"></script>
<script src="js/spending.js"></script>
<script src="js/legal.js"></script>
<script src="js/build.js"></script>
<script>
/* ============================================================
   裝修無伏 app.html — SPA, hash routing.
   Routes: #/login #/dashboard #/needs #/quotes #/build #/legal #/spending
   全部寫入 optimistic update + 失敗 toast（見 CLAUDE_BUILD_SPEC.md §5.2）
   ============================================================ */

const appEl = document.getElementById('app');
const toastEl = document.getElementById('toast');

// ---------------- small utils ----------------
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n) {
  if (n === null || n === undefined || n === '') return '$0';
  return '$' + Number(n).toLocaleString();
}
function dispDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function flatTypeLabel(v) { return (FLAT_TYPES.find(t => t.value === v) || {}).label || v || '未設定'; }
function scopeLabel(v) { return (SCOPES.find(t => t.value === v) || {}).label || v || '未設定'; }
function roomIsComplete(r) {
  return !!(r.answers && r.answers.usage !== undefined && r.answers.storage !== undefined && r.answers.sockets !== undefined && r.answers.lighting !== undefined);
}
let toastTimer = null;
function toast(msg, isErr) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
}
function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) { const old = btn.textContent; btn.textContent = '已複製 ✓'; setTimeout(() => btn.textContent = old, 1400); }
  } catch (e) { toast('複製失敗，請手動選取', true); }
}

// ---------------- global state ----------------
const state = {
  session: null,
  user: null,
  projects: [],
  currentProjectId: null,
  rooms: [],
  activeRoomId: null,
  needsStep: 0,
  needsView: 'wizard', // 'wizard' | 'summary'
  addRoomFormOpen: false,
  roomPhotos: [], // current room's design-reference gallery (state.needsView === 'design')
  floorPlanPendingPoint: null, // {x,y} normalized — first tap of a not-yet-finished measurement line
  pendingCalibrationLine: null, // {x1,y1,x2,y2} normalized — line awaiting a real-world length input
  quotes: [],
  quoteFormOpen: false,
  lastQuoteFormKey: null, // 上次 render 時打開咗邊個表單（'quote:<id>'／'contract:<id>'／null），用嚟判斷表單係咪剛剛打開
  contractFormOpen: false,
  editingQuoteId: null,
  prefillQuoteScope: null,
  stages: [],
  photosByStage: {}, // stageId -> [{...row, url}]
  legalRecords: [],
  legalTab: 'lawyer', // 'lawyer' | 'mortgage'
  legalFormOpen: false,
  editingLegalId: null,
  onboardingStep: 0,
  onboarding: {
    stage: 'plan',
  },
};

// ---------------- landing.html handoff ----------------
// landing.html's two calculators write a plain object to sessionStorage (key below)
// then send the user to app.html#/login so they can create an account. auth.js's
// onAuthStateChange already bounces #/login -> #/dashboard once a session exists, so
// by the time renderDashboard() runs (fresh login or already-logged-in repeat visit)
// this key may be sitting there waiting to be turned into a new project. Consumed
// (read + removed) exactly once per landing visit; unknown/invalid fields are dropped
// rather than trusted blindly, since sessionStorage content originates from another page.
const LANDING_PAYLOAD_KEY = 'mmh_landing_payload';
function consumeLandingPayload() {
  let raw;
  try { raw = sessionStorage.getItem(LANDING_PAYLOAD_KEY); } catch (e) { return null; }
  if (!raw) return null;
  try { sessionStorage.removeItem(LANDING_PAYLOAD_KEY); } catch (e) { /* ignore */ }
  let data;
  try { data = JSON.parse(raw); } catch (e) { return null; }
  if (!data || typeof data !== 'object') return null;
  const fields = { name: '由計算器建立嘅 project' };
  if (FLAT_TYPES.some(t => t.value === data.flat_type)) fields.flat_type = data.flat_type;
  if (SCOPES.some(t => t.value === data.scope)) fields.scope = data.scope;
  const szCheck = checkNumber(data.size_sqft, LIMITS.size);
  if (szCheck.ok && szCheck.value) fields.size_sqft = szCheck.value;
  const bgCheck = checkNumber(data.budget_cap, LIMITS.budget);
  if (bgCheck.ok && bgCheck.value > 0) fields.budget_cap = bgCheck.value;
  if (typeof data.start_date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(data.start_date)) fields.start_date = data.start_date;
  return fields;
}

function projectKey(userId) { return 'mmh_current_project_' + userId; }
function onboardingPrefsKey(userId) { return 'mmh_onboarding_prefs_' + userId; }
function loadOnboardingPrefs(userId) {
  try { return JSON.parse(localStorage.getItem(onboardingPrefsKey(userId))) || {}; }
  catch (e) { return {}; }
}
function saveOnboardingPrefs(userId, prefs) {
  try { localStorage.setItem(onboardingPrefsKey(userId), JSON.stringify(prefs)); }
  catch (e) { /* preferences are optional; project creation should still work */ }
}
function loadCurrentProjectId(userId) {
  return localStorage.getItem(projectKey(userId)) || null;
}
function saveCurrentProjectId(userId, projectId) {
  if (projectId) localStorage.setItem(projectKey(userId), projectId);
  else localStorage.removeItem(projectKey(userId));
}
function currentProject() {
  return state.projects.find(p => p.id === state.currentProjectId) || null;
}
// Loads this user's projects and resolves state.currentProjectId, defaulting to the
// first project if nothing (valid) was persisted yet. Every route that needs a
// project (#/dashboard #/needs #/quotes #/build) calls this — previously only
// #/dashboard had this fallback, so deep-linking straight to #/needs etc. (e.g. a
// page refresh while on that route) incorrectly bounced to #/dashboard even when a
// project existed, because state.currentProjectId was still null.
async function resolveProjects() {
  state.projects = await listProjects(state.user.id);
  if (!state.currentProjectId) state.currentProjectId = loadCurrentProjectId(state.user.id);
  if (!state.projects.find(p => p.id === state.currentProjectId)) {
    state.currentProjectId = state.projects.length ? state.projects[0].id : null;
  }
  if (state.currentProjectId) saveCurrentProjectId(state.user.id, state.currentProjectId);
  return currentProject();
}

// ---------------- router ----------------
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => {
  if (!location.hash) location.hash = '#/login';
  route();
});

async function route() {
  const hash = location.hash || '#/login';
  const path = hash.split('?')[0];
  if (path !== '#/quotes') state.lastQuoteFormKey = null;   // 離開報價頁再返嚟，表單仍然開住就再捲動一次
  // Google 登入被取消／失敗，Supabase 會帶 #error=…（隱式流程）或 ?error=…（PKCE）返嚟；
  // 之前當成未知路由、靜靜跳去 #/login，用家唔知發生咩事。
  const oauthErr = /^#error=/.test(hash) ? new URLSearchParams(hash.slice(1)).get('error') : new URLSearchParams(location.search).get('error');
  if (oauthErr) {
    state.loginError = loginErrorMessage(oauthErr);
    if (location.search) history.replaceState(null, '', location.pathname);   // 清走 ?error=…，免得 refresh 又再出
    location.hash = '#/login'; return;
  }
  try {
    // `return renderXxx()` (without await) does NOT let this try/catch see a
    // LATER rejection from renderXxx — the try block already returned by the
    // time it rejects, so it becomes a silent unhandled promise rejection:
    // the page just freezes on stale content with no visible error at all.
    // Confirmed real (2026-09-14): a signed-URL fetch hitting the stuck
    // cross-tab session-lock timeout inside #/needs's design view did exactly
    // this — looked like "uploaded fine, but nothing ever shows". `await`ing
    // here means any such failure actually reaches the catch below.
    if (path === '#/login') { await renderLogin(); return; }
    if (path === '#/dashboard') { await renderDashboard(); return; }
    if (path === '#/needs') { await renderNeeds(); return; }
    if (path === '#/quotes') { await renderQuotes(); return; }
    if (path === '#/build') { await renderBuild(); return; }
    if (path === '#/legal') { await renderLegal(); return; }
    if (path === '#/spending') { await renderSpending(); return; }
    location.hash = '#/login';
  } catch (err) {
    console.error('[route] failed:', err);
    appEl.innerHTML = `<div class="empty">出錯喇：${esc(err.message || '未知錯誤')}<br><button class="btn mtop" onclick="location.reload()">重新載入</button></div>`;
  }
}

// Common guard: ensures a session, populates state.session/user. Redirects+returns
// null if not logged in (route render functions should `return` immediately after).
async function guard() {
  const session = await requireSession();
  if (!session) return null;
  state.session = session;
  state.user = session.user;
  return session;
}

// ---------------- shared chrome ----------------
function chromeShell(activeTab, bodyHtml, projRowHtml) {
  const tabs = [
    { key: 'dashboard', hash: '#/dashboard', ic: '🏠', label: '今日' },
    { key: 'needs',     hash: '#/needs',     ic: '📋', label: '規劃' },
    { key: 'quotes',    hash: '#/quotes',    ic: '📑', label: '揀公司' },
    { key: 'build',     hash: '#/build',     ic: '🧱', label: '施工' },
    { key: 'legal',     hash: '#/legal',     ic: '⚖️', label: '法律財務' },
    { key: 'spending',  hash: '#/spending',  ic: '💰', label: '總支出' },
  ];
  return `
    <div class="apphead">
      <button class="lg" data-nav="#/dashboard">裝修無伏<small>MAKEMYHOME</small></button>
      <button class="avatar" id="avatarBtn" title="登出" aria-label="登出">${esc((state.user && state.user.email || 'S')[0].toUpperCase())}</button>
    </div>
    ${projRowHtml || ''}
    <div class="body">${bodyHtml}</div>
    <div class="tabbar">
      ${tabs.map(t => `<button data-nav="${t.hash}" class="${activeTab === t.key ? 'on' : ''}"><span class="ic">${t.ic}</span>${t.label}</button>`).join('')}
    </div>
  `;
}
function projectRowHtml() {
  const opts = state.projects.map(p => `<option value="${p.id}" ${p.id === state.currentProjectId ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  return `<div class="projrow">🏠 Project：
    <select id="projSelect" aria-label="切換 project">${opts}<option value="__new__">＋ 開新 project</option></select>
  </div>`;
}
function attachChromeEvents() {
  appEl.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => { location.hash = el.dataset.nav; }));
  const avatarBtn = document.getElementById('avatarBtn');
  if (avatarBtn) avatarBtn.addEventListener('click', async () => {
    if (confirm('登出裝修無伏？')) { await logout(); }
  });
  const projSelect = document.getElementById('projSelect');
  if (projSelect) projSelect.addEventListener('change', async () => {
    if (projSelect.value === '__new__') { location.hash = '#/dashboard'; state.forceNewProjectForm = true; await renderDashboard(); return; }
    state.currentProjectId = projSelect.value;
    saveCurrentProjectId(state.user.id, state.currentProjectId);
    route();
  });
}

// ================================================================
// #/login
// ================================================================
// 由 landing 計算器撳「儲存到我嘅 project」過嚟嘅話，sessionStorage 有 payload（登入後 consumeLandingPayload 會讀走）。
// 呢度淨係 peek（唔移除），畀用家知道佢個計算結果仲喺度。數字照樣驗證，唔信 sessionStorage。
function peekLandingPayload() {
  try {
    const d = JSON.parse(sessionStorage.getItem(LANDING_PAYLOAD_KEY) || 'null');
    if (!d || typeof d !== 'object') return null;
    const sz = checkNumber(d.size_sqft, LIMITS.size), bg = checkNumber(d.budget_cap, LIMITS.budget);
    const parts = [];
    if (sz.ok && sz.value) parts.push(sz.value.toLocaleString('en-US') + ' 呎');
    if (bg.ok && bg.value > 0) parts.push('預算約 ' + money(bg.value));
    return parts.length ? parts.join('・') : null;
  } catch (e) { return null; }
}

function loginErrorMessage(code) {
  return code === 'access_denied'
    ? '你取消咗 Google 登入。想繼續就再撳一次。'
    : '登入唔成功，請再試一次。如果持續失敗，請檢查網絡，或者容許瀏覽器開啟 Google 登入視窗。';
}

async function renderLogin() {
  const session = await getSession();
  if (session) { location.hash = '#/dashboard'; return; }
  const carried = peekLandingPayload();
  const loginError = state.loginError || ''; state.loginError = '';
  appEl.innerHTML = `
    <div style="max-width:420px;margin:0 auto">
      <div class="body" style="text-align:center;padding:64px 24px">
        <div style="font-size:2.4rem">🏠</div>
        <h1 style="font-size:1.35rem;color:var(--green);margin:10px 0 4px">裝修無伏</h1>
        <p style="font-size:.85rem;color:var(--ink2);margin-bottom:${carried ? '16px' : '28px'}">儲存你嘅裝修計劃・報價比較・驗收記錄</p>
        ${carried ? `<div class="note good" style="text-align:left">✓ 你喺計算器揀嘅資料（${esc(carried)}）已經準備好，登入後會自動帶入新 project。</div>` : ''}
        <button class="gbtn" id="googleBtn"><span class="gi"></span><span id="googleBtnLabel">用 Google 帳戶繼續</span></button>
        <div class="field-err" id="loginErr" role="alert" ${loginError ? '' : 'hidden'} style="text-align:left;margin-top:12px">${esc(loginError)}</div>
        <p style="font-size:.72rem;color:var(--muted);margin-top:20px">我哋只攞你個 email 做登入，唔會 send 嘢俾你。你嘅計劃同相片只有你自己睇到。</p>
        <p style="margin-top:18px"><a href="./" class="loginback">← 返回首頁，先試下免費計算器</a></p>
      </div>
    </div>`;
  const btn = document.getElementById('googleBtn'), label = document.getElementById('googleBtnLabel'), errBox = document.getElementById('loginErr');
  btn.addEventListener('click', async () => {
    errBox.hidden = true;
    btn.disabled = true; label.textContent = '連接緊 Google…';   // 防止連撳；成功會成頁跳走
    const err = await loginWithGoogle();
    if (err) {
      btn.disabled = false; label.textContent = '用 Google 帳戶繼續';
      errBox.textContent = loginErrorMessage('failed');
      errBox.hidden = false;
    }
  });
}
// 由 Google 頁撳返回（bfcache 還原）：個掣仲係「連接緊…」，要重新畫返
window.addEventListener('pageshow', e => { if (e.persisted && location.hash === '#/login') renderLogin(); });

// ================================================================
// #/dashboard
// ================================================================
async function renderDashboard() {
  if (!(await guard())) return;

  const pendingPayload = consumeLandingPayload();
  if (pendingPayload) {
    try {
      const created = await createProject(state.user.id, pendingPayload);
      state.currentProjectId = created.id;
      saveCurrentProjectId(state.user.id, created.id);
      toast('已用計算器結果幫你開咗個新 project ✓');
    } catch (e) { toast('自動建立 project 失敗：' + e.message, true); }
  }

  await resolveProjects();

  if (!state.projects.length) {
    return renderOnboarding();
  }
  if (state.forceNewProjectForm) {
    return renderNewProjectForm(false);
  }

  const project = currentProject();
  const [rooms, quotes, stages] = await Promise.all([
    listRooms(project.id),
    listQuotes(project.id),
    ensureStages(state.user.id, project.id),
  ]);
  const photoCount = await countPhotosForStages(stages.map(s => s.id));

  // 而家階段 card
  const awaitingInspection = stages.find(s => s.finished_on && !s.inspected_on);
  const inProgress = stages.find(s => s.started_on && !s.finished_on);
  const nextStage = stages.find(s => !s.started_on);
  const allDone = stages.length && stages.every(s => s.finished_on && s.inspected_on);
  const notStarted = stages.every(s => !s.started_on);
  let stageTitle, stageNote = '';
  if (allDone) {
    stageTitle = '🎉 全部工序已完成及驗收';
  } else if (awaitingInspection) {
    const sDef = STAGES.find(s => s.k === awaitingInspection.key);
    stageTitle = `待驗收 — ${sDef.n}`;
    stageNote = '先完成驗收記錄，再開始下一個工序。';
  } else if (inProgress) {
    const sDef = STAGES.find(s => s.k === inProgress.key);
    stageTitle = `施工中 — ${sDef.n}`;
    if (project.start_date) {
      const offsets = scheduleOffsets(project);
      const off = offsets.find(o => o.key === inProgress.key);
      if (off) {
        const d = new Date(project.start_date + 'T00:00:00');
        d.setDate(d.getDate() + off.endOffsetDays);
        stageNote = `📍 預計 <b>${dispDate(d.toISOString().slice(0,10))}</b> 前完成呢個工序`;
      }
    }
    const tip = STAGE_TIPS[inProgress.key];
    if (tip) stageNote += (stageNote ? '<br>' : '') + tip;
  } else if (notStarted) {
    stageTitle = project.start_date ? `未開工 — 預計 ${dispDate(project.start_date)} 開工` : '未開工';
  } else if (nextStage) {
    const sDef = STAGES.find(s => s.k === nextStage.key);
    stageTitle = `下一步 — 開始${sDef.n}`;
    stageNote = '上一個工序已驗收，可以記錄今個工序實際開工日期。';
  } else {
    stageTitle = '施工記錄待補充';
  }

  const roomsComplete = rooms.filter(roomIsComplete).length;
  const signedQuote = quotes.find(q => q.status === 'signed');
  const signedContract = quotes.find(q => q.status === 'signed' && q.flags && q.flags._kind === 'contract');
  const contractGapsNow = signedContract ? contractGaps(signedContract) : [];
  const contractGapCount = contractGapsNow.length;
  const contractExternalCount = contractGapsNow.filter(g => g.status === 'external').length;
  const contractCheckCount = contractGapsNow.filter(g => g.status === 'check').length;
  const contractOtherQuotes = signedContract ? quotes.filter(q => q !== signedContract) : [];
  const contractHandoff = handoffStatus(signedContract, contractOtherQuotes);
  const unassignedExternalCount = contractHandoff.unresolved.filter(item => item.status === 'external').length;
  const onboardingPrefs = loadOnboardingPrefs(state.user.id);
  const reachedPrepare = ['prepare', 'build'].includes(onboardingPrefs.stage);
  const reachedBuild = onboardingPrefs.stage === 'build';
  const quoteStepDone = quotes.length >= 3 || !!signedQuote || reachedPrepare;
  const contractStepDone = !!signedContract && contractHandoff.confirmed && !contractHandoff.unresolved.length;

  const routeSteps = [
    { label: '建立單位資料', done: true },
    { label: '預算＋需求規劃', done: !!project.budget_cap && roomsComplete > 0, current: !reachedPrepare && (!project.budget_cap || roomsComplete === 0) },
    { label: '比較裝修報價', done: quoteStepDone, current: !reachedPrepare && !quoteStepDone && !!project.budget_cap && roomsComplete > 0 },
    { label: '簽約＋開工準備', done: contractStepDone, current: quoteStepDone && !contractStepDone },
    { label: '施工＋分段驗收', done: allDone, current: !allDone && (contractStepDone || reachedBuild || !notStarted) },
  ];
  const completedRouteSteps = routeSteps.filter(s => s.done).length;
  const progress = Math.round(completedRouteSteps / routeSteps.length * 100);

  let nextAction;
  if (onboardingPrefs.stage === 'prepare' && !signedContract) nextAction = { title: '加入已簽合約', desc: '記錄主合約包咗乜，搵出要另外報價或問清楚嘅工程。', hash: '#/quotes?mode=contract', action: '加入合約 →' };
  else if (onboardingPrefs.stage === 'build' && !signedContract) nextAction = { title: '補回已簽合約', desc: '施工中都可以補記合約範圍，方便追蹤漏項同額外工程。', hash: '#/quotes?mode=contract', action: '加入合約 →' };
  else if (contractHandoff.unresolved.length > 0) nextAction = { title: `開工前仲有 ${contractHandoff.unresolved.length} 項責任未落實`, desc: `${contractCheckCount ? `${contractCheckCount} 項要問清楚` : ''}${contractCheckCount && unassignedExternalCount ? '、' : ''}${unassignedExternalCount ? `${unassignedExternalCount} 項未揀負責公司` : ''}。逐項定好由邊間公司負責。`, hash: '#/quotes', action: '處理責任 →' };
  else if (signedContract && !contractHandoff.confirmed) nextAction = { title: '確認開工前責任交接', desc: '七大工程已有負責公司；確認一次，再帶住責任清單進入施工。', hash: '#/quotes', action: '確認交接 →' };
  else if (contractStepDone && !allDone) nextAction = notStarted
    ? { title: '準備第一個施工工序', desc: '責任交接已完成；確認開工日期，施工期間每完成一段就即場驗收。', hash: '#/build', action: '設定工期 →' }
    : { title: stageTitle, desc: stageNote || '由而家工序開始，補返日期、驗收清單同相片記錄。', hash: '#/build', action: '查看施工 →' };
  else if (onboardingPrefs.stage === 'quote' && !signedQuote) nextAction = { title: '加入手上嘅裝修報價', desc: '將價錢同紅旗放埋一齊比較，先決定邊間值得再傾。', hash: '#/quotes', action: '加入報價 →' };
  else if (!project.budget_cap) nextAction = { title: '定低裝修預算上限', desc: '設定上限之後，報價比較先可以幫你指出超支風險。', action: '設定預算 →', edit: true };
  else if (!rooms.length) nextAction = { title: '加入第一間房', desc: '先由客飯廳開始，整理用途、傢俬、儲物同電掣。', hash: '#/needs', action: '開始規劃 →' };
  else if (roomsComplete < rooms.length) nextAction = { title: '完成房間需求', desc: `仲有 ${rooms.length - roomsComplete} 間房未完成，完成後就可以匯出需求書。`, hash: '#/needs', action: '繼續規劃 →' };
  else if (quotes.length < 3) nextAction = { title: '收齊最少 3 份報價', desc: `而家有 ${quotes.length} 份，放埋一齊先容易睇出漏項同可疑低價。`, hash: '#/quotes', action: '加入報價 →' };
  else if (!signedQuote) nextAction = { title: '核對報價風險', desc: '唔好淨係睇總價；逐項比較品牌、付款期同合約保障。', hash: '#/quotes', action: '開始比較 →' };
  else if (notStarted) nextAction = { title: '準備第一個施工工序', desc: '確認開工日期，施工期間每完成一段就即場驗收。', hash: '#/build', action: '設定工期 →' };
  else nextAction = { title: stageTitle, desc: stageNote || '跟住而家工序完成驗收清單同相片記錄。', hash: '#/build', action: '查看施工 →' };

  const deadlineRows = dashboardDeadlines(project.start_date, {
    roomsDone: !!project.budget_cap && roomsComplete > 0,
    quotesDone: quoteStepDone,
    contractDone: !!signedContract,
  });
  let timingAlert = '';
  if (project.start_date) {
    const days = Math.ceil((new Date(project.start_date + 'T00:00:00') - new Date()) / 86400000);
    if (days > 0 && reachedPrepare && !signedContract) timingAlert = `距離預計開工約 ${days} 日，記得加入已簽合約，同埋確認有冇漏項要另外報價。`;
    else if (days > 0 && !signedQuote) timingAlert = `距離預計開工約 ${days} 日，最好預留時間比較報價同核對合約。`;
    else if (days <= 0 && notStarted) timingAlert = '預計開工日已到，記得更新實際工期狀態。';
  }

  const body = `
    <div class="dashintro">
      <div><div class="eyebrow">你今日嘅裝修重點</div><h2>${esc(project.name)}</h2><div class="dt">${project.start_date ? `預計 ${dispDate(project.start_date)} 開工` : '未設定開工日期'}</div></div>
      <div class="overall"><b>${progress}%</b><span>整體準備</span><div class="miniprog"><i style="width:${progress}%"></i></div></div>
    </div>
    <div class="nextcard">
      <div><div class="eyebrow">而家最應該做</div><h3>${nextAction.title}</h3><p>${nextAction.desc}</p></div>
      <button class="btn mustard" id="nextActionBtn">${nextAction.action}</button>
    </div>
    ${timingAlert ? `<div class="timingalert">⚠️ <span><b>時間提醒：</b>${timingAlert}</span></div>` : ''}
    <div class="dashgrid">
      <div class="card routecard">
        <div class="rowflex"><h3>你嘅裝修路線</h3><span class="dt">${completedRouteSteps}/${routeSteps.length} 已完成</span></div>
        <div class="routepath">${routeSteps.map((s, i) => `
          <div class="routeitem ${s.current ? 'current' : ''} ${s.done ? 'done' : ''}">
            <i>${s.done ? '✓' : i + 1}</i><span>${s.label}</span><small>${s.done ? '完成' : (s.current ? '而家' : '未開始')}</small>
          </div>`).join('')}</div>
      </div>
      <div class="card deadlinecard">
        <div class="rowflex"><h3>嚟緊期限</h3><span class="dt">按開工日倒數</span></div>
        ${deadlineRows.length ? deadlineRows.map(r => `<div class="deadlinerow"><b>${r.date}</b><span>${r.label}</span></div>`).join('') : `<div class="empty compact">${project.start_date ? '裝修前嘅準備工夫都做晒，安心跟進施工同驗收。' : '設定開工日期後，呢度會幫你倒數重要期限。'}</div>`}
      </div>
    </div>
    <div class="card projectsummary">
      <div class="rowflex"><h3>Project 設定</h3><button class="iconbtn" id="editProjBtn">✏️ 編輯</button></div>
      <div class="dt">${flatTypeLabel(project.flat_type)} · ${project.size_sqft || '?'} 呎 · ${scopeLabel(project.scope)} · 預算上限 ${project.budget_cap ? money(project.budget_cap) : '未設'} · ${photoCount} 張施工相</div>
    </div>`;
  appEl.innerHTML = chromeShell('dashboard', body, projectRowHtml());
  attachChromeEvents();
  document.getElementById('nextActionBtn').addEventListener('click', () => {
    if (nextAction.edit) renderNewProjectForm(false, project);
    else location.hash = nextAction.hash;
  });
  const editBtn = document.getElementById('editProjBtn');
  if (editBtn) editBtn.addEventListener('click', () => renderNewProjectForm(false, project));
}

// Only shows reminders for stages the user hasn't actually finished yet —
// previously this was pure date arithmetic off start_date with no regard for
// real progress, so a user who'd already signed a contract still saw "收齊
// 3 份報價" / "揀定公司" nagging them about steps they'd long completed.
function dashboardDeadlines(startDate, doneFlags) {
  if (!startDate) return [];
  doneFlags = doneFlags || {};
  const defs = [
    { days: 90, label: '開始整理房間需求', done: doneFlags.roomsDone },
    { days: 60, label: '收齊最少 3 份報價', done: doneFlags.quotesDone },
    { days: 30, label: '揀定公司及核對合約', done: doneFlags.contractDone },
  ];
  return defs.filter(d => !d.done).map(d => {
    const date = new Date(startDate + 'T00:00:00');
    date.setDate(date.getDate() - d.days);
    return { date: dispDate(date.toISOString().slice(0, 10)), label: d.label };
  });
}

    content = `<div class="eyebrow">30 秒設定</div><h1>你而家去到裝修邊一步？</h1><p class="onboardlede">揀最接近嘅狀態，我哋會將首頁變成一張只顯示你下一步嘅行動清單。</p>

    content = `<div class="eyebrow">你嘅單位</div><h1>先幫你砌好時間同預算框架</h1><p class="onboardlede">只問影響最大嘅資料，其餘可以之後慢慢補。</p>
      <div class="grid2 onboardform">
        <div><label class="f" for="obName">Project 名稱</label><input type="text" id="obName" value="${esc(data.name || '')}" placeholder="例：太古城新屋"></div>
        <div><label class="f" for="obSize">實用面積（呎）</label><input type="number" id="obSize" value="${data.size_sqft || 450}" min="100" max="3000"></div>
        <div><label class="f" for="obScope">工程範圍</label><select id="obScope">${SCOPES.map(s => `<option value="${s.value}" ${data.scope === s.value ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>

      </div><p class="dt">之後可以喺 Project 設定修改。</p>`;
  }
  appEl.innerHTML = `<div class="onboardhead"><b>裝修無伏</b><small>MAKEMYHOME</small></div><div class="onboardwrap"><div class="onboardsteps">${[0,1].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>${content}<div class="onboardactions">${step ? '<button class="btn gh" id="obBack">← 返回</button>' : '<span></span>'}<button class="btn" id="obNext">${step === 1 ? '建立我嘅計劃 →' : '下一步 →'}</button></div></div>`;
  appEl.querySelectorAll('[data-stagechoice]').forEach(btn => btn.addEventListener('click', () => { data.stage = btn.dataset.stagechoice; renderOnboarding(); }));
  const back = document.getElementById('obBack');
  if (back) back.addEventListener('click', () => { state.onboardingStep--; renderOnboarding(); });
  const obSizeInput = document.getElementById('obSize');
  if (obSizeInput) obSizeInput.addEventListener('input', () => clearFieldError(obSizeInput));
  document.getElementById('obNext').addEventListener('click', async () => {
    if (step === 0) { state.onboardingStep = 1; return renderOnboarding(); }
    if (step === 1) {
      data.name = document.getElementById('obName').value.trim();
      data.scope = document.getElementById('obScope').value;
      data.start_date = document.getElementById('obDate').value || null;
      if (!data.name) { toast('請幫個 project 改名', true); return; }
      const obSizeEl = document.getElementById('obSize');
      const obSizeRes = readNumber(obSizeEl, LIMITS.size, { required: true });
      if (!obSizeRes) { obSizeEl.focus(); return; }
      data.size_sqft = obSizeRes.value;
    }
    // 第 2 步（單位資料）填完就直接建立 project——之前仲有一步「最想解決嘅事」，但揀咗嘅重點
    // 成個 app 冇任何地方用到，所以拎走咗（2026-10-12）。
    const btn = document.getElementById('obNext');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const created = await createProject(state.user.id, {
        name: data.name,
        size_sqft: data.size_sqft,
        scope: data.scope || 'full',
        start_date: data.start_date,
        flat_type: 'private',

      state.currentProjectId = created.id;
      saveCurrentProjectId(state.user.id, created.id);
      saveOnboardingPrefs(state.user.id, { stage: data.stage });
      state.onboardingStep = 0;
      toast('你嘅裝修路線已經準備好 ✓');
      renderDashboard();
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = '建立我嘅計劃 →'; }
  });
}

// Type-the-project-name-to-unlock confirm modal (防手震) — replaces a plain
// confirm() since deleting a project also cascades rooms/quotes/stages/photos/
// legal+finance records and can't be undone.
function openDeleteProjectModal(project) {
  const bg = document.createElement('div');
  bg.className = 'modalbg';
  bg.innerHTML = `
    <div class="modalcard">
      <h3>刪除 project</h3>
      <p>刪除「<b>${esc(project.name)}</b>」會連埋房間、報價、施工記錄、相片同法律財務記錄一齊刪走，<b>唔可以復原</b>。</p>
      <label class="f" for="delConfirmInput">要刪除，請打返個 project 名稱確認：</label>
      <input type="text" id="delConfirmInput" placeholder="${esc(project.name)}" autocomplete="off">
      <div class="mtop">
        <button class="btn danger" id="delConfirmBtn" disabled>確認刪除</button>
        <button class="btn gh" id="delCancelBtn">取消</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const input = bg.querySelector('#delConfirmInput');
  const confirmBtn = bg.querySelector('#delConfirmBtn');
  input.addEventListener('input', () => { confirmBtn.disabled = input.value !== project.name; });
  bg.querySelector('#delCancelBtn').addEventListener('click', () => bg.remove());
  bg.addEventListener('click', (ev) => { if (ev.target === bg) bg.remove(); });
  confirmBtn.addEventListener('click', async () => {
    confirmBtn.disabled = true; confirmBtn.innerHTML = '<span class="spin"></span>';
    try {
      await deleteProject(project.id);
      bg.remove();
      state.currentProjectId = null;
      saveCurrentProjectId(state.user.id, null);
      state.forceNewProjectForm = false;
      toast('已刪除');
      renderDashboard();
    } catch (e) {
      toast(e.message, true);
      confirmBtn.disabled = false;
      confirmBtn.textContent = '確認刪除';
    }
  });
}

const QUICK_ROOMS = ['客飯廳', '主人房', '細房', '廚房', '浴室'];

// Once a room is one of the known QUICK_ROOMS presets, step 1 shouldn't ask
// the user to type its purpose from scratch — pre-fill a sensible usage
// default, and offer common furniture as clickable suggestions (same idea as
// STORAGE_TYPE_OPTIONS in step 2) instead of a blank free-text-only field.
// Custom/unrecognised room names get neither — we don't know what they're for.
const ROOM_USAGE_SUGGESTIONS = {
  '客飯廳': '客廳＋飯廳',
  '主人房': '睡眠＋更衣',
  '細房':   '睡眠＋儲物／工作',
  '廚房':   '煮食＋洗碗',
  '浴室':   '如廁＋沖涼',
};
const ROOM_FURNITURE_SUGGESTIONS = {
  '客飯廳': ['梳化', '電視櫃', '飯桌', '餐椅', '茶几', '鞋櫃'],
  '主人房': ['床架', '床褥', '衣櫃', '梳妝台', '床頭櫃'],
  '細房':   ['床架', '衣櫃', '書枱', '層架'],
  '廚房':   ['雪櫃', '煮食爐', '抽油煙機', '洗衣機', '微波爐', '碗櫃'],

// Shared "pick a common room or type your own" picker — used both for the
// very first room (empty state) and for adding a 2nd+ room. Previously the
// suggestion chips only existed in the empty state; adding another room fell
// back to a bare native prompt() with no suggestions at all.
function roomPickerHtml(existingNames) {
  const available = QUICK_ROOMS.filter(n => !existingNames.includes(n));

async function renderNeeds() {
  if (!(await guard())) return;
  const project = await resolveProjects();
  if (!project) { toast('請先開一個 project', true); location.hash = '#/dashboard'; return; }

  state.rooms = await listRooms(project.id);
  if (!state.rooms.find(r => r.id === state.activeRoomId)) {
    state.activeRoomId = state.rooms.length ? state.rooms[0].id : null;
    state.needsStep = 0;
  }

  let bodyHtml;
  if (!state.rooms.length) {
    bodyHtml = `
      <div class="card">
        <h3>先加返間房</h3>
        <p class="dt" style="margin-bottom:10px">揀個常見房間，或者自己打名。</p>
        ${roomPickerHtml([])}
      </div>`;
  } else if (state.needsView === 'summary') {
    bodyHtml = renderNeedsSummary(project);
  } else if (state.needsView === 'design') {
    bodyHtml = await renderRoomDesign(project);
  } else {
    bodyHtml = renderNeedsWizard(project);
  }

  appEl.innerHTML = chromeShell('needs', bodyHtml, projectRowHtml());
  attachChromeEvents();
  attachNeedsEvents(project);
}

// which made it hard to notice or get back to. Showing all 3 with the

function renderNeedsWizard(project) {
  const room = state.rooms.find(r => r.id === state.activeRoomId);
  const roomTabsHtml = roomTabsBarHtml();
  const topBar = needsViewTabsHtml();
  if (!room) return topBar + roomTabsHtml;

  const step = state.needsStep;
  const a = room.answers || {};
  const dots = ROOM_WIZARD_STEPS.map((s, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');

  let stepBody = '';
  if (step === 0) {
    const usageSuggestion = ROOM_USAGE_SUGGESTIONS[room.name];
    const furnitureSuggestions = ROOM_FURNITURE_SUGGESTIONS[room.name] || [];
    const currentFurniture = (a.furniture || '').split(/[,，、]/).map(s => s.trim()).filter(Boolean);
    stepBody = `
      <h3>${esc(room.name)} · 第 1 步：用途＋大嚿傢俬 🛋️</h3>
      <label class="f" for="f-usage">呢間房主要用途</label>

      <h3>${esc(room.name)} · 第 2 步：儲物量 📦</h3>

      <div class="f" id="storagetypes-label">需要邊種收納？</div>
      <div class="chiprow" role="group" aria-labelledby="storagetypes-label">${STORAGE_TYPE_OPTIONS.map(t => `<label><input type="checkbox" data-storagetype="${esc(t)}" ${(storage.types||[]).includes(t) ? 'checked' : ''}> ${esc(t)}</label>`).join('')}</div>

  } else if (step === 2) {
    const sockets = a.sockets || {};
    const socketTypes = socketTypesForRoom(room.name);
    stepBody = `
      <h3>${esc(room.name)} · 第 3 步：電掣＋插座＋網絡位 🔌</h3>
      ${socketTypes.map(t => `
        <div class="f" id="ctrlabel-${t.key}">${t.label}</div>
        <div class="counter" role="group" aria-labelledby="ctrlabel-${t.key}">
          <button data-ctr="${t.key}" data-delta="-1" aria-label="減少${t.label}數量">−</button>
          <b id="ctr-${t.key}">${sockets[t.key] || 0}</b>
          <button data-ctr="${t.key}" data-delta="1" aria-label="增加${t.label}數量">＋</button>
          <span class="hint">${t.hint}</span>
        </div>`).join('')}
      <label class="f" for="f-extra">呢間房仲有咩特別電器？</label>
      <input type="text" id="f-extra" placeholder="例：抽濕機、風扇燈、電熱氈…" value="${esc(sockets.extra || '')}">`;
  } else {
    const lighting = a.lighting || {};
    stepBody = `
      <h3>${esc(room.name)} · 第 4 步：燈光 💡</h3>
      <label class="f" for="f-mainswitch">主燈開關</label>
      <select id="f-mainswitch">
        <option value="single" ${lighting.main_switch!=='double'?'selected':''}>單控（一個位開關）</option>
        <option value="double" ${lighting.main_switch==='double'?'selected':''}>雙控（房門＋床頭都有開關）</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.85rem"><input type="checkbox" id="f-dimmer" style="width:auto" ${lighting.dimmer?'checked':''}> 需要調光／情景燈掣</label>
      <label class="f" for="f-lightnotes">特別燈光需求</label>
      <textarea id="f-lightnotes" placeholder="例：床頭閱讀燈、層板灯槽、廚房工作枱燈">${esc(lighting.notes || '')}</textarea>`;

  return `
    ${topBar}
    ${roomTabsHtml}
    <div class="card">
      <div class="stepdots">${dots}</div>
      ${stepBody}
      <div class="mtop">
        ${step > 0 ? '<button class="btn gh" data-stepprev="1">← 上一步</button> ' : ''}

}

// 燈掣一直有喺 wizard 第 4 步問（單控/雙控、調光、特別燈光需求），但掣位
// 清單之前淨係讀 answers.sockets，燈掣資料完全冇顯示——即係俾電工睇嗰張
// 清單漏晒燈掣位置。呢個 helper 將 answers.lighting 轉做同插座一樣嘅
// {label, qty, note} 列，畀 renderNeedsSummary／generateSocketListText 共用。
function lightingSwitchRows(lighting) {
  if (!lighting) return [];
  const rows = [];
  const isDouble = lighting.main_switch === 'double';
  rows.push({
    label: `主燈開關（${isDouble ? '雙控' : '單控'}）`,
    qty: isDouble ? 2 : 1,
    note: `牆身離地約 120–130cm，${isDouble ? '房門口＋床頭／梳化位各一個' : '房門口一個'}`,
  });
  if (lighting.dimmer) rows.push({ label: '調光／情景燈掣', qty: 1, note: '牆身離地約 120–130cm，主開關旁' });
  if (lighting.notes) rows.push({ label: '特別燈光位', qty: '—', note: lighting.notes });
  return rows;
}

  const brief = generateBrief(project, state.rooms);
  const socketRows = [];
  state.rooms.forEach(r => {
    const s = (r.answers && r.answers.sockets) || {};
    socketTypesForRoom(r.name).forEach(t => {
      const qty = s[t.key] || 0;

// ================================================================
// #/needs — 設計＋平面圖（每間房獨立：一張可以度尺嘅平面圖 + 一個純
// 相片嘅設計參考 gallery）。度尺做法：起止點存做 0-1 normalized 座標
// （相對 floor_plan_width/height，唔受畫面顯示大小影響）；第一條線要求
// 用家輸入實際長度做校準，之後嘅線就用返個 scale（米/像素）自動計。
// ================================================================
function pixelDistance(line, w, h) {
  const dx = (line.x2 - line.x1) * w;
  const dy = (line.y2 - line.y1) * h;
  return Math.sqrt(dx * dx + dy * dy);
}

function measurementSvg(m, w, h) {
  const x1 = m.x1 * w, y1 = m.y1 * h, x2 = m.x2 * w, y2 = m.y2 * h;
  const color = m.isCalibration ? '#C4622D' : '#3E5C50';
  const r = Math.max(w, h) * 0.012;
  const strokeW = Math.max(w, h) * 0.004;
  const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
  return `
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${strokeW}" stroke-dasharray="${strokeW * 3} ${strokeW * 2}"></line>
    <circle cx="${x1}" cy="${y1}" r="${r}" fill="${color}"></circle>
    <circle cx="${x2}" cy="${y2}" r="${r}" fill="${color}"></circle>
    <rect x="${midX - r * 3.4}" y="${midY - r * 1.1}" width="${r * 6.8}" height="${r * 2.2}" rx="${r * 1.1}" fill="${color}"></rect>
    <text x="${midX}" y="${midY + r * 0.4}" text-anchor="middle" font-size="${r * 1.4}" fill="#fff" font-weight="700">${m.meters}m</text>`;
}

async function renderRoomDesign(project) {
  const room = state.rooms.find(r => r.id === state.activeRoomId);
  const roomTabsHtml = roomTabsBarHtml();
  const topBar = needsViewTabsHtml();
  if (!room) return topBar + roomTabsHtml;

  const [roomPhotos] = await Promise.all([listRoomPhotos(room.id)]);
  // One photo's signed-URL fetch failing (or timing out) shouldn't blank the
  // whole design view — Promise.all with no per-item guard would reject the
  // entire render on a single bad photo. Degrade that one thumbnail instead.
  await Promise.all(roomPhotos.map(async p => {
    try { const { data } = await roomPhotoSignedUrl(p.path); p.url = data ? data.signedUrl : ''; }
    catch (e) { console.error('[design] roomPhotoSignedUrl failed for', p.id, e); p.url = ''; }
  }));
  state.roomPhotos = roomPhotos;

  const measurements = room.floor_plan_measurements || [];
  const hasFloorPlan = !!room.floor_plan_path;
  const hasScale = room.floor_plan_scale !== null && room.floor_plan_scale !== undefined;
  let floorPlanUrl = '';
  if (hasFloorPlan) {
    try { const { data } = await floorPlanSignedUrl(room.floor_plan_path); floorPlanUrl = data ? data.signedUrl : ''; }
    catch (e) { console.error('[design] floorPlanSignedUrl failed', e); floorPlanUrl = ''; }
  }

  const floorPlanBody = !hasFloorPlan ? `
    <div class="ph add" style="width:100%;height:140px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:.85rem" data-uploadfloorplan>
      <span style="font-size:1.4rem">＋</span>上載平面圖
    </div>` : `
    <div style="position:relative;width:100%;line-height:0">
      <img src="${floorPlanUrl}" id="floorPlanImg" style="width:100%;display:block;border-radius:9px;cursor:crosshair;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none" draggable="false">
      <svg viewBox="0 0 ${room.floor_plan_width} ${room.floor_plan_height}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
        ${measurements.map(m => measurementSvg(m, room.floor_plan_width, room.floor_plan_height)).join('')}
        ${state.floorPlanPendingPoint ? `<circle cx="${state.floorPlanPendingPoint.x * room.floor_plan_width}" cy="${state.floorPlanPendingPoint.y * room.floor_plan_height}" r="${Math.max(room.floor_plan_width, room.floor_plan_height) * 0.012}" fill="#C4622D"></circle>` : ''}
      </svg>
    </div>
    <div class="mtop">
      ${!hasScale ? '<span class="dt">撳相入面兩個點畫一條你知道長度嘅線（例如一幅牆），畫完會問你實際長度嚟校準比例尺。</span>' : (state.floorPlanPendingPoint ? '<span class="dt">再撳一下完成呢條度尺線。</span>' : '<span class="dt">撳相度兩個點就可以再加一條度尺線。</span>')}
      <div class="mtop">
        <button class="btn sm gh" data-replacefloorplan>換一張平面圖</button>
        ${hasScale ? '<button class="btn sm gh" data-resetscale style="margin-left:6px">重設比例尺</button>' : ''}
      </div>
    </div>
    ${state.pendingCalibrationLine ? `
    <div class="card" style="margin-top:10px">
      <div style="font-size:.98rem;font-weight:700;margin-bottom:6px">校準比例尺</div>
      <p class="dt">你啱啱畫嗰條線，實際長度係幾多米？之後畫嘅線就會自動計出尺寸。</p>
      <label class="f" for="calibrationMeters">實際長度（米）</label>
      <input type="number" id="calibrationMeters" min="0" step="0.01" placeholder="例：3.2">
      <div class="mtop">
        <button class="btn sm" id="confirmCalibration">確認校準</button>
        <button class="btn sm gh" id="cancelCalibration" style="margin-left:6px">取消</button>
      </div>
    </div>` : ''}
    ${measurements.length ? `
    <div class="card" style="margin-top:10px">
      <div style="font-size:.98rem;font-weight:700;margin-bottom:6px">已度尺寸</div>
      ${measurements.map((m, i) => `<div class="rowflex" style="padding:6px 0;border-bottom:1px dashed var(--line)">
        <span style="font-size:.85rem">${m.isCalibration ? '📏 校準線' : `度尺線 ${i + 1}`}</span>
        <span style="display:flex;align-items:center;gap:8px"><b style="color:var(--green)">${m.meters}m</b><button class="iconbtn" data-delmeasurement="${i}">🗑️</button></span>

  const galleryBody = `

      <div class="ph add" data-addroomphoto>＋</div>
    </div>
    <input type="file" accept="image/*" multiple id="roomPhotoInput" aria-label="上載設計參考相" style="display:none">

  return `
    ${topBar}

function attachNeedsEvents(project) {
  appEl.querySelectorAll('[data-quickroom]').forEach(el => el.addEventListener('click', () => quickAddRoom(project, el.dataset.quickroom)));
  const addBtn = document.getElementById('addRoomBtn');
  if (addBtn) addBtn.addEventListener('click', () => {
    const name = document.getElementById('newRoomName').value.trim();
    if (name) quickAddRoom(project, name);
  });
  appEl.querySelectorAll('[data-room]').forEach(el => el.addEventListener('click', () => {
    state.activeRoomId = el.dataset.room; state.needsStep = 0; state.needsView = 'wizard'; renderNeeds();
  }));
  appEl.querySelectorAll('[data-addroom]').forEach(el => el.addEventListener('click', () => {
    state.addRoomFormOpen = !state.addRoomFormOpen; renderNeeds();
  }));
  const cancelAddRoomBtn = document.getElementById('cancelAddRoom');
  if (cancelAddRoomBtn) cancelAddRoomBtn.addEventListener('click', () => { state.addRoomFormOpen = false; renderNeeds(); });
  appEl.querySelectorAll('[data-view]').forEach(el => el.addEventListener('click', () => { state.needsView = el.dataset.view; renderNeeds(); }));
  appEl.querySelectorAll('[data-delroom]').forEach(el => el.addEventListener('click', async () => {
    if (!confirm('刪除呢間房？呢間房嘅問卷答案會一齊刪走。')) return;
    try { await deleteRoom(el.dataset.delroom); toast('已刪除'); state.activeRoomId = null; renderNeeds(); }
    catch (e) { toast(e.message, true); }
  }));
  appEl.querySelectorAll('[data-copy]').forEach(el => el.addEventListener('click', () => {
    const text = el.dataset.copy === 'brief' ? generateBrief(project, state.rooms) : generateSocketListText(state.rooms);
    copyText(text, el);
  }));
  appEl.querySelectorAll('[data-dl]').forEach(el => el.addEventListener('click', () => {
    const isBrief = el.dataset.dl === 'brief';
    downloadText(isBrief ? '需求書.txt' : '掣位清單.txt', isBrief ? generateBrief(project, state.rooms) : generateSocketListText(state.rooms));
  }));

  // counters (step 3)
  appEl.querySelectorAll('[data-ctr]').forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.ctr; const delta = +el.dataset.delta;
    const b = document.getElementById('ctr-' + key);
    const next = Math.max(0, (+b.textContent || 0) + delta);
    b.textContent = next;
  }));

  // furniture suggestion chips (step 1) — toggle a suggested item in/out of
  // the free-text furniture field rather than requiring it to be typed out.
  appEl.querySelectorAll('[data-furnituretag]').forEach(el => el.addEventListener('click', () => {
    const tag = el.dataset.furnituretag;
    const input = document.getElementById('f-furniture');
    const current = input.value.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
    const idx = current.indexOf(tag);
    if (idx >= 0) current.splice(idx, 1); else current.push(tag);
    input.value = current.join('、');
    const nowOn = current.includes(tag);
    el.classList.toggle('on', nowOn);
    el.setAttribute('aria-pressed', nowOn);
    el.textContent = (nowOn ? '✓ ' : '＋ ') + tag;
  }));

  const stepBtn = appEl.querySelector('[data-stepnext]');
  if (stepBtn) stepBtn.addEventListener('click', async () => {
    const dir = stepBtn.dataset.stepnext;
    const room = state.rooms.find(r => r.id === state.activeRoomId);
    if (!room) return;
    const answers = Object.assign({}, room.answers || {});
    const step = state.needsStep;
    const oldLabel = stepBtn.textContent;
    try {
      if (step === 0) {
        answers.usage = document.getElementById('f-usage').value.trim();
        answers.furniture = document.getElementById('f-furniture').value.trim();
      } else if (step === 1) {
        answers.storage = {
          level: document.getElementById('f-level').value,
          types: Array.from(appEl.querySelectorAll('[data-storagetype]:checked')).map(x => x.dataset.storagetype),
          note: document.getElementById('f-storagenote').value.trim(),
        };
      } else if (step === 2) {
        const sockets = {};
        socketTypesForRoom(room.name).forEach(t => { sockets[t.key] = +document.getElementById('ctr-' + t.key).textContent || 0; });
        sockets.extra = document.getElementById('f-extra').value.trim();
        answers.sockets = sockets;
      } else {
        answers.lighting = {
          main_switch: document.getElementById('f-mainswitch').value,
          dimmer: document.getElementById('f-dimmer').checked,
          notes: document.getElementById('f-lightnotes').value.trim(),
        };
      }
      // optimistic update
      room.answers = answers;
      const savedStep = step;
      stepBtn.disabled = true; stepBtn.innerHTML = '<span class="spin"></span>';
      await updateRoom(room.id, { answers });
      if (dir === 'save') {
        // Finishing the last step used to just re-render the same step 4 —
        // nothing left to do there. Straight to 需求書＋掣位清單 makes more
        // sense: that's the actual deliverable this whole wizard builds towards.
        toast(`「${room.name}」已經規劃完成 ✓`);
        state.needsView = 'summary';
        renderNeeds();
        return;
      }
      state.needsStep = savedStep + (+dir);
      renderNeeds();
    } catch (e) {
      toast(e.message, true);
      stepBtn.disabled = false; stepBtn.textContent = oldLabel;
    }
  });

  appEl.querySelectorAll('[data-stepprev]').forEach(el => el.addEventListener('click', () => {
    state.needsStep = Math.max(0, state.needsStep - 1); renderNeeds();
  }));

  // ---------------- 設計＋平面圖（state.needsView === 'design'） ----------------
  const designRoom = state.rooms.find(r => r.id === state.activeRoomId);
  const floorPlanInput = document.getElementById('floorPlanInput');
  appEl.querySelectorAll('[data-uploadfloorplan],[data-replacefloorplan]').forEach(el => el.addEventListener('click', () => {
    if (floorPlanInput) floorPlanInput.click();
  }));
  if (floorPlanInput) floorPlanInput.addEventListener('change', async () => {
    if (!floorPlanInput.files || !floorPlanInput.files.length || !designRoom) return;
    toast('上載緊平面圖…');
    try {
      const updated = await uploadFloorPlan(state.user.id, designRoom.id, floorPlanInput.files[0]);
      Object.assign(designRoom, updated);
      state.floorPlanPendingPoint = null;
      state.pendingCalibrationLine = null;
      toast('已上載平面圖 ✓');
      renderNeeds();
    } catch (e) { toast('上載失敗：' + e.message, true); }
  });

  const resetScaleBtn = appEl.querySelector('[data-resetscale]');
  if (resetScaleBtn) resetScaleBtn.addEventListener('click', async () => {
    if (!confirm('重設比例尺？已經度好嘅尺寸會一齊清走，要重新校準。')) return;
    try {
      await updateRoom(designRoom.id, { floor_plan_scale: null, floor_plan_measurements: [] });
      designRoom.floor_plan_scale = null;
      designRoom.floor_plan_measurements = [];
      state.pendingCalibrationLine = null;
      toast('已重設');
      renderNeeds();
    } catch (e) { toast(e.message, true); }
  });

  const floorPlanImg = document.getElementById('floorPlanImg');
  if (floorPlanImg) floorPlanImg.addEventListener('click', async (ev) => {
    const rect = floorPlanImg.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    const y = Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height));
    if (!state.floorPlanPendingPoint) {
      state.floorPlanPendingPoint = { x, y };
      renderNeeds();
      return;
    }
    const line = { x1: state.floorPlanPendingPoint.x, y1: state.floorPlanPendingPoint.y, x2: x, y2: y };
    state.floorPlanPendingPoint = null;
    const hasScale = designRoom.floor_plan_scale !== null && designRoom.floor_plan_scale !== undefined;
    if (!hasScale) {
      state.pendingCalibrationLine = line;
      renderNeeds();
      return;
    }
    const meters = Math.round(pixelDistance(line, designRoom.floor_plan_width, designRoom.floor_plan_height) * designRoom.floor_plan_scale * 100) / 100;
    const measurements = (designRoom.floor_plan_measurements || []).concat([{ ...line, meters }]);
    try {
      await updateRoom(designRoom.id, { floor_plan_measurements: measurements });
      designRoom.floor_plan_measurements = measurements;
      renderNeeds();
    } catch (e) { toast(e.message, true); renderNeeds(); }
  });

  const confirmCalBtn = document.getElementById('confirmCalibration');
  if (confirmCalBtn) confirmCalBtn.addEventListener('click', async () => {
    const metersVal = +document.getElementById('calibrationMeters').value;
    if (!metersVal || metersVal <= 0) { toast('請輸入有效長度', true); return; }
    const line = state.pendingCalibrationLine;
    const pixelDist = pixelDistance(line, designRoom.floor_plan_width, designRoom.floor_plan_height);
    const scale = metersVal / pixelDist;
    const measurement = { ...line, meters: metersVal, isCalibration: true };
    try {
      confirmCalBtn.disabled = true; confirmCalBtn.innerHTML = '<span class="spin"></span>';
      await updateRoom(designRoom.id, { floor_plan_scale: scale, floor_plan_measurements: [measurement] });
      designRoom.floor_plan_scale = scale;
      designRoom.floor_plan_measurements = [measurement];
      state.pendingCalibrationLine = null;
      toast('已校準比例尺 ✓');
      renderNeeds();
    } catch (e) { toast(e.message, true); confirmCalBtn.disabled = false; confirmCalBtn.textContent = '確認校準'; }
  });
  const cancelCalBtn = document.getElementById('cancelCalibration');
  if (cancelCalBtn) cancelCalBtn.addEventListener('click', () => { state.pendingCalibrationLine = null; renderNeeds(); });

  appEl.querySelectorAll('[data-delmeasurement]').forEach(el => el.addEventListener('click', async () => {
    const idx = +el.dataset.delmeasurement;
    const measurements = (designRoom.floor_plan_measurements || []).slice();
    const removed = measurements.splice(idx, 1)[0];
    const patch = { floor_plan_measurements: measurements };
    if (removed && removed.isCalibration) { patch.floor_plan_scale = null; patch.floor_plan_measurements = []; }
    try {
      await updateRoom(designRoom.id, patch);
      Object.assign(designRoom, patch);
      toast('已刪除');
      renderNeeds();
    } catch (e) { toast(e.message, true); }
  }));

  const roomPhotoInput = document.getElementById('roomPhotoInput');
  appEl.querySelectorAll('[data-addroomphoto]').forEach(el => el.addEventListener('click', () => {
    if (roomPhotoInput) roomPhotoInput.click();
  }));
  if (roomPhotoInput) roomPhotoInput.addEventListener('change', async () => {
    if (!roomPhotoInput.files || !roomPhotoInput.files.length || !designRoom) return;
    toast('上載緊相片…');
    try {
      const rows = [];
      for (const file of Array.from(roomPhotoInput.files)) rows.push(await uploadRoomPhoto(state.user.id, designRoom.id, file));
      state.roomPhotos = state.roomPhotos.concat(rows);
      toast(`已上載 ${rows.length} 張相`);
      renderNeeds();
    } catch (e) { toast('上載失敗：' + e.message, true); }
  });
  appEl.querySelectorAll('[data-delroomphoto]').forEach(el => el.addEventListener('click', async () => {
    const [photoId, path] = el.dataset.delroomphoto.split(':');
    if (!confirm('刪除呢張相？')) return;
    const backup = state.roomPhotos;
    state.roomPhotos = backup.filter(p => p.id !== photoId);
    renderNeeds();
    try { await deleteRoomPhoto(photoId, path); toast('已刪除'); }
    catch (e) { state.roomPhotos = backup; toast(e.message, true); renderNeeds(); }
  }));
}

async function quickAddRoom(project, name) {

function generateBrief(project, rooms) {
  const budget = project.budget_cap ? money(project.budget_cap) : '未定';
  let out = `【裝修需求書】\n單位：${project.name || '（未填）'}\n樓型：${flatTypeLabel(project.flat_type)}\n面積：${project.size_sqft || '?'} 呎\n工程範圍：${scopeLabel(project.scope)}\n預算上限：${budget}\n預計開工：${project.start_date ? dispDate(project.start_date) : '未定'}\n`;
  rooms.forEach(r => {
    const a = r.answers || {};
    out += `\n── ${r.name} ──\n用途：${a.usage || '（未填）'}\n大型傢俬：${a.furniture || '（未填）'}\n儲物需求：${storageText(a.storage)}\n燈光需求：${lightingText(a.lighting)}\n`;
  });
  out += `\n想同貴司確認：\n1. 請提供逐項報價（工序＋物料品牌型號＋數量＋單價）\n2. 付款擬分期，每期以驗收合格為準\n3. 請註明工期、延誤安排及保養期範圍`;
  return out;
}
function storageText(storage) {
  if (!storage) return '（未填）';
  const levelMap = { low: '少', med: '中', high: '多' };
  let out = levelMap[storage.level] || '';
  if (storage.types && storage.types.length) out += (out ? '；' : '') + '需要：' + storage.types.join('、');
  if (storage.note) out += (out ? '；' : '') + storage.note;
  return out || '（未填）';
}
function lightingText(lighting) {
  if (!lighting) return '（未填）';
  let out = '主燈' + (lighting.main_switch === 'double' ? '雙控' : '單控');
  if (lighting.dimmer) out += '＋調光掣';
  if (lighting.notes) out += '；' + lighting.notes;
  return out;
}
function generateSocketListText(rooms) {
  let out = '【全屋掣位＋燈掣清單】\n';
  rooms.forEach(r => {
    const s = (r.answers && r.answers.sockets) || {};
    const lines = [];
    socketTypesForRoom(r.name).forEach(t => { const qty = s[t.key] || 0; if (qty > 0) lines.push(`　${t.label} × ${qty}　建議高度：${t.height}`); });
    if (s.extra) lines.push(`　其他：${s.extra}`);
    lightingSwitchRows(r.answers && r.answers.lighting).forEach(row => lines.push(`　${row.label} × ${row.qty}　${row.note}`));
    if (lines.length) out += `\n${r.name}\n${lines.join('\n')}\n`;
  });
  return out;
}

const CONTRACT_SCOPES = [
  { key: 'demo', label: '清拆工程' },
  { key: 'wet', label: '泥水／防水／鋪磚' },
  { key: 'me', label: '水電工程' },
  { key: 'wood', label: '木工／訂造傢俬' },
  { key: 'paint', label: '油漆工程' },
  { key: 'install', label: '潔具／燈具／設備安裝' },
  { key: 'clean', label: '清場／完工清潔' },
];
const CONTRACT_SCOPE_STATUS = {
  included: { label: '已包括', cls: 'g' },
  external: { label: '要另行報價', cls: 'r' },
  check: { label: '要問清楚', cls: 'o' },
};
const CONTRACT_SCOPE_QUESTIONS = {
  demo: '想同你確認，清拆工程包括邊啲位置？清拆、搬運同棄置費係咪已經全部包喺合約？',
  wet: '想同你確認，泥水、防水同鋪磚包括咩範圍？防水高度、試水安排、磁磚數量同損耗係咪已包？',
  me: '想同你確認，水電工程包括幾多個插蘇／燈位、咩品牌型號，同埋改位或加位點樣計費？',
  wood: '想同你確認，木工／訂造傢俬包括邊幾件、物料同五金品牌型號，送貨安裝係咪已包？',
  paint: '想同你確認，油漆工程包括批盪、底漆同面漆幾多層，用咩品牌系列，同埋修補點計？',
  install: '想同你確認，潔具、燈具同設備安裝包括邊啲項目？接駁、開孔同額外配件係咪已包？',
  clean: '想同你確認，合約係咪包括清場同完工清潔？包括幾多次，同埋建築廢料會由邊個處理？',
};
const CONTRACT_STAGE_MAP = {
  demo: 'demo', me: 'me', wet: 'wet', wood: 'wood', paint: 'paint', install: 'fit', clean: 'clean',
};

function contractGaps(contract) {
  const scope = (contract.flags && contract.flags._contract_scope) || {};
  return CONTRACT_SCOPES.filter(item => ['external', 'check'].includes(scope[item.key])).map(item => ({ ...item, status: scope[item.key] }));
}

function responsibilityPlan(contract, otherQuotes) {
  if (!contract) return [];
  const scope = (contract.flags && contract.flags._contract_scope) || {};
  return CONTRACT_SCOPES.map(item => {
    const status = scope[item.key] || 'check';
    const candidates = otherQuotes.filter(q => q.flags && q.flags._quote_for === item.label);
    const selectedQuote = candidates.find(q => q.flags && q.flags._responsibility_selected);
    return {
      ...item,
      stageKey: CONTRACT_STAGE_MAP[item.key],
      status,
      candidates,
      selectedQuote,
      company: status === 'included' ? contract.company : (selectedQuote ? selectedQuote.company : null),
      source: status === 'included' ? '主合約' : (selectedQuote ? '額外報價' : null),
      ready: status === 'included' || (status === 'external' && !!selectedQuote),
    };
  });
}

function handoffStatus(contract, otherQuotes) {
  const plan = responsibilityPlan(contract, otherQuotes);
  return {
    plan,
    readyCount: plan.filter(item => item.ready).length,
    unresolved: plan.filter(item => !item.ready),
    confirmed: !!(contract && contract.flags && contract.flags._handoff_confirmed),
  };
}

async function renderQuotes() {
  if (!(await guard())) return;
  const project = await resolveProjects();
  if (!project) { toast('請先開一個 project', true); location.hash = '#/dashboard'; return; }

  state.quotes = await listQuotes(project.id);
  const prefs = loadOnboardingPrefs(state.user.id);
  const contract = state.quotes.find(q => q.status === 'signed' && q.flags && q.flags._kind === 'contract');
  const otherQuotes = state.quotes.filter(q => q !== contract);
  const hasUnassignedExternal = contract && responsibilityPlan(contract, otherQuotes).some(item => item.status === 'external' && !item.ready);
  const wantsContract = ['prepare', 'build'].includes(prefs.stage);
  if (location.hash.includes('mode=contract') && !contract) state.contractFormOpen = true;

  let body = '';
  if (contract) {
    body += contractCardHtml(contract, otherQuotes);
  } else if (wantsContract) {
    body += `<div class="contractintro"><div class="eyebrow">你已經簽約</div><h2>先加入主合約，再睇清楚有冇漏項</h2><p>記錄合約包括範圍；未包嘅工程可以再獨立搵公司報價。</p>${state.contractFormOpen ? '' : '<button class="btn" id="addContractBtn">加入已簽合約 →</button>'}</div>`;
  }

  if (!wantsContract && !contract) {
    body += otherQuotes.length ? otherQuotes.map(q => quoteCardHtml(q)).join('') : '<div class="empty">未有公司報價，撳下面「＋ 加公司」開始比較。</div>';
    body += otherQuotes.length ? compareTableHtml(otherQuotes) : '';
  } else if (otherQuotes.length) {
    body += `<div class="sectionlabel">額外工程報價</div>${otherQuotes.map(q => quoteCardHtml(q)).join('')}`;
  }

  if (state.contractFormOpen) {
    body += `<div class="card contractformcard">${contractFormHtml(contract && state.editingQuoteId === contract.id ? contract : null, project)}</div>`;
  } else if (state.quoteFormOpen) {
    body += `<div class="card">${quoteFormHtml(state.quotes.find(q => q.id === state.editingQuoteId), contract ? contractGaps(contract) : [])}</div>`;
  } else if (!wantsContract || contract) {
    body += `<div class="card"><button class="btn gh" id="addQuoteBtn">＋ ${contract ? (hasUnassignedExternal ? '為未落實項目加入報價' : '加入候選報價') : '加公司'}</button></div>`;
  }

  appEl.innerHTML = chromeShell('quotes', body, projectRowHtml());
  attachChromeEvents();
  attachQuotesEvents(project, contract);

  // 表單喺列表同對比表下面，手機要自己捲落去先見到。表單「剛打開／換咗編輯對象」就捲到表單；
  // 新增時順手 focus 公司名（編輯唔 focus，免得鍵盤彈出遮住想改嘅欄位）。
  // 同一個表單開住期間嘅其他 re-render（例如刪除另一間公司）唔會再捲，免得跳走。
  const formKey = state.contractFormOpen ? 'contract:' + (state.editingQuoteId || '')
    : (state.quoteFormOpen ? 'quote:' + (state.editingQuoteId || '') : null);
  if (formKey && formKey !== state.lastQuoteFormKey) {
    const firstField = document.getElementById(state.contractFormOpen ? 'c-company' : 'q-company');
    const card = firstField && firstField.closest('.card');
    if (card) {
      card.style.scrollMarginTop = '72px';   // 留位畀 sticky 嘅 .apphead
      card.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      if (!state.editingQuoteId) firstField.focus({ preventScroll: true });
    }
  } else if (!formKey && state.lastQuoteFormKey) {
    // 表單剛剛收埋（儲存或取消）：返到頂部，見到新增／更新咗嘅公司同對比表
    window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
  }
  state.lastQuoteFormKey = formKey;
}
function prefersReducedMotion() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// 額外報價「已確認」＝標記已簽約，或者喺漏項責任度揀咗做負責公司。
// （以前只認後者，所以單純標「已簽約」嘅額外報價唔會計入總數。）
function committedExtraQuotes(contract, otherQuotes) {
  const selectedIds = new Set(responsibilityPlan(contract, otherQuotes)
    .filter(item => item.status === 'external' && item.selectedQuote)
    .map(item => item.selectedQuote.id));
  return otherQuotes.filter(q => q.status === 'signed' || selectedIds.has(q.id));
}

// 工程明細存喺 flags._line_items（[{name, amount}]）；舊報價冇呢個 key → null。
function quoteLineItems(q) {
  const items = q && q.flags && q.flags._line_items;
  return Array.isArray(items) ? items : null;
}

function contractCardHtml(contract, otherQuotes) {
  const scope = (contract.flags && contract.flags._contract_scope) || {};
  const gaps = contractGaps(contract);
  const responsibility = responsibilityPlan(contract, otherQuotes);
  const hasUnassignedExternal = responsibility.some(item => item.status === 'external' && !item.ready);
  const selectedExtraQuotes = committedExtraQuotes(contract, otherQuotes);
  const selectedExtraTotal = selectedExtraQuotes.reduce((sum, q) => sum + (+q.total || 0), 0);
  const confirmedTotal = (+contract.total || 0) + selectedExtraTotal;
  const candidateCount = otherQuotes.length - selectedExtraQuotes.length;
  return `<div class="contractcard">
    <div class="contracthead"><div><div class="eyebrow">已簽主合約</div><h2>${esc(contract.company)}</h2></div><b>${money(contract.total)}</b></div>
    <div class="contractmeta">${contract.flags._contract_end_date ? `預計 ${dispDate(contract.flags._contract_end_date)} 完工 · ` : ''}${contract.file_path ? `<a href="#" data-viewfile="${contract.id}">📎 查看已簽合約</a>` : '未上載合約檔案'}</div>
    ${gaps.length ? contractActionCenterHtml(contract, otherQuotes) : '<div class="note good">✓ 七大工程範圍都已確認包括</div>'}
    ${contractHandoffHtml(contract, otherQuotes)}
    <details class="contractdetails" ${gaps.length ? '' : 'open'}><summary>查看七大工程範圍</summary><div class="contractscope">${CONTRACT_SCOPES.map(item => {
      const status = CONTRACT_SCOPE_STATUS[scope[item.key]] || CONTRACT_SCOPE_STATUS.check;
      return `<div><span>${item.label}</span><i class="pill ${status.cls}">${status.label}</i></div>`;
    }).join('')}</div></details>
    <div class="combinedtotal">目前已確認預算：主合約 ${money(contract.total)}${selectedExtraQuotes.length ? ` ＋ 已確認額外工程 ${money(selectedExtraTotal)}` : ''} ＝ <b>${money(confirmedTotal)}</b>${candidateCount ? `<br><small>${candidateCount} 份未簽約／未獲選候選報價不計入</small>` : ''}</div>
    <div class="mtop"><button class="btn sm gh" data-editcontract="${contract.id}">編輯合約</button>${hasUnassignedExternal ? ' <button class="btn sm" id="addMissingQuoteBtn">為未落實項目加入報價</button>' : ''}</div>
  </div>`;
}

function contractActionCenterHtml(contract, otherQuotes) {
  const gaps = contractGaps(contract);
  const uncertain = gaps.filter(g => g.status === 'check');
  const external = gaps.filter(g => g.status === 'external');
  const includedCount = CONTRACT_SCOPES.length - gaps.length;
  const scopeQuotes = label => otherQuotes.filter(q => q.flags && q.flags._quote_for === label);
  const unresolved = responsibilityPlan(contract, otherQuotes).filter(item => !item.ready);
  const allResponsibilitiesReady = unresolved.length === 0;
  return `<div class="gapcenter">
    <div class="gapcenterhead"><div class="eyebrow">${allResponsibilitiesReady ? '開工前已處理' : '開工前要處理'}</div><h3>${allResponsibilitiesReady ? '合約範圍責任已落實' : `合約仲有 ${unresolved.length} 項未落實`}</h3><p>${allResponsibilitiesReady ? '主合約以外工程已揀定負責公司。' : '逐項問清楚、補報價，再確認由邊間公司負責。'}</p></div>
    <div class="gapsummary"><div class="external"><b>${external.length}</b><span>主合約外</span></div><div class="check"><b>${uncertain.length}</b><span>要問清楚</span></div><div class="included"><b>${includedCount}</b><span>已包括</span></div></div>
    ${uncertain.length ? `<div class="gapsection"><div class="gapsectiontitle">第一步：問清楚 <span>${uncertain.length} 項</span></div>${uncertain.map(item => `<div class="gapitem"><div class="gapitemhead"><div><b>${item.label}</b><p>${esc(CONTRACT_SCOPE_QUESTIONS[item.key])}</p></div><i class="pill o">待問</i></div><div class="gapactions"><button class="btn sm" data-copy-question="${item.key}">複製問法</button><button class="btn sm gh" data-resolve-scope="${item.key}">記錄答案</button></div></div>`).join('')}</div>` : ''}
    ${external.length ? `<div class="gapsection"><div class="gapsectiontitle">主合約外工程 <span>${external.length} 項</span></div>${external.map(item => { const quotes = scopeQuotes(item.label); const selected = quotes.find(q => q.flags && q.flags._responsibility_selected); return `<div class="gapitem"><div class="gapitemhead"><div><b>${item.label}</b><p>${selected ? `主合約不包括；已揀定由 ${esc(selected.company)} 負責。` : '主合約不包括；加入報價後，揀定最後由邊間公司負責。'}</p></div><i class="pill ${selected ? 'g' : 'r'}">${selected ? '責任已落實' : '未落實'}</i></div><div class="gapactions"><button class="btn sm" data-add-scope-quote="${item.key}">加入報價</button></div>${quotes.length ? `<div class="responsibilitychoices">${quotes.map(q => `<button class="responsibilitychoice ${q === selected ? 'selected' : ''}" data-select-responsibility="${q.id}" data-scope-label="${esc(item.label)}"><b>${esc(q.company)}</b><span>${money(q.total)}${q === selected ? ' · 已選定' : ' · 揀呢間負責'}</span></button>`).join('')}</div><div class="quoteprogress">已有 ${quotes.length} 間報價${quotes.length < 3 ? ` · 仲差 ${3 - quotes.length} 間就可以比較` : ' · 可以開始比較'}</div>` : ''}</div>`; }).join('')}</div>` : ''}
  </div>`;
}

function contractHandoffHtml(contract, otherQuotes) {
  const handoff = handoffStatus(contract, otherQuotes);
  return `<div class="handoffcard">
    <div class="rowflex"><div><div class="eyebrow">開工前責任交接</div><h3>${handoff.readyCount}/7 項已有負責公司</h3></div><span class="pill ${handoff.confirmed && !handoff.unresolved.length ? 'g' : (handoff.unresolved.length ? 'o' : 'mut')}">${handoff.confirmed && !handoff.unresolved.length ? '已確認交接' : (handoff.unresolved.length ? `${handoff.unresolved.length} 項未落實` : '待確認')}</span></div>
    <div class="handofflist">${handoff.plan.map(item => `<div class="handoffrow ${item.ready ? 'ready' : ''}"><div><b>${item.label}</b><span>${item.company ? `${esc(item.company)} · ${item.source}` : (item.status === 'check' ? '要先向主承辦商問清楚' : '未揀定額外報價公司')}</span></div><small>施工：${esc((STAGES.find(s => s.k === item.stageKey) || {}).n || item.label)}</small></div>`).join('')}</div>
    ${handoff.unresolved.length ? '<div class="handofflock">先處理上面未落實項目；施工頁仍然可以預覽。</div>' : (handoff.confirmed ? '<button class="btn sm gh" data-open-build>查看施工責任 →</button>' : '<button class="btn" id="confirmHandoffBtn">確認交接並進入施工 →</button>')}
  </div>`;
}

function contractFormHtml(editing, project) {
  const q = editing || { flags: {} };
  const flags = q.flags || {};
  const scope = flags._contract_scope || {};
  const scopeRows = CONTRACT_SCOPES.map(item => `<div class="contractscoperow"><b>${item.label}</b><select data-contract-scope="${item.key}" aria-label="${item.label}">
    <option value="included" ${scope[item.key] === 'included' ? 'selected' : ''}>已包括</option>
    <option value="external" ${scope[item.key] === 'external' ? 'selected' : ''}>不包括，要另行報價</option>
    <option value="check" ${!scope[item.key] || scope[item.key] === 'check' ? 'selected' : ''}>唔確定，要問清楚</option>
  </select></div>`).join('');
  return `<h3>${editing ? '編輯已簽合約' : '加入已簽合約'}</h3>
    <div class="grid2">
      <div><label class="f" for="c-company">裝修公司</label><input type="text" id="c-company" value="${esc(q.company || '')}" placeholder="例：安居工程"></div>
      <div><label class="f" for="c-total">合約總額（$）</label><input type="number" id="c-total" value="${q.total || ''}" min="0"></div>
      <div><label class="f" for="c-start">開工日期</label><input type="date" id="c-start" value="${project.start_date || ''}"></div>
      <div><label class="f" for="c-end">預計完工日期</label><input type="date" id="c-end" value="${flags._contract_end_date || ''}"></div>
    </div>
    <div class="f" id="contractscope-label">份合約包咗邊啲工程？</div><p class="dt" id="contractscope-hint">唔肯定就揀「要問清楚」，唔好當成已包括。</p>
    <div class="contractscopeform" role="group" aria-labelledby="contractscope-label" aria-describedby="contractscope-hint">${scopeRows}</div>
    <label class="f" for="c-file">上載已簽合約（PDF／相片，可選）</label><input type="file" id="c-file" accept=".pdf,image/*">
    <div class="mtop"><button class="btn" id="c-save">${editing ? '儲存更改' : '儲存已簽合約'}</button> <button class="btn gh" id="c-cancel">取消</button></div>`;
}

function quoteCardHtml(q) {

  const color = scoreColor(score);
  const checkedFlags = FLAGS.filter(f => (q.flags || {})[f.key]).map(f => f.label);
  return `
    <div class="qcard" ${score < 5 ? 'style="border-color:var(--danger)"' : ''}>
      <div class="hd"><b>${esc(q.company)} ${q.status === 'signed' ? '<span class="pill g">已簽約</span>' : ''}</b><span class="price ${score < 5 ? 'bad' : ''}">${money(q.total)}</span></div>

      <div class="bar2"><i style="width:${score*10}%;background:${color}"></i></div>
      <div class="flagrow"><span class="score" style="color:${color}">報價安全度 ${score}/10${score>=8?' ✓':(score<5?' ✗':'')}</span>${checkedFlags.length ? ' · ' + checkedFlags.slice(0,3).map(f=>esc(f)+' 🚩').join(' · ') + (checkedFlags.length>3?` 等 ${checkedFlags.length} 項`:'') : ' · 冇剔中紅旗'}

        <button class="iconbtn" data-delquote="${q.id}" style="float:right">🗑️</button>
      </div>
